<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙：大道長生錄</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #58a6ff; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-cheat { background-color: #8957e5; }
        .btn-cheat:hover { background-color: #9e6aef; }
        .event-text {
            font-size: 15px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h1>🌌 《修仙：大道長生錄》</h1>
    <p>唯一真界 · 群雄並起 · 萬帝共存大世</p>

    <div id="start-screen" class="panel">
        <h3>天道法網已鋪設完畢！</h3>
        <p>請做出你的開局抉擇：</p>
        <button class="btn" onclick="startRandomGame()">【天道】開啟隨機投胎輪迴</button>
        <button class="btn btn-cheat" onclick="startCheatGame()">【作弊】帝族神體無敵開局</button>
    </div>

    <div id="game-screen" class="panel" style="display:none;">
        <h2>📥 角色數據面板</h2>
        <div id="status-panel" class="event-text"></div>
        <hr style="border-color: #30363d; margin: 20px 0;">
        <h2>📜 輪迴演化歷程</h2>
        <div id="event-panel" class="event-text"></div>
        <div id="options-panel" style="margin-top: 20px;"></div>
    </div>

    <script>
        let p = {
            age: 0,
            realmIndex: 0,
            progress: 0,
            lifespan: 85,
            maxLifespan: 85,
            lingShi: 0,
            bgType: "",
            bgDetail: "",
            father: "",
            mother: "",
            lingGen: "",
            bodyType: "凡軀",
            gongFa: "無",
            gongFaLevel: 0,
            yan: 50, zhi: 50, xin: 50, yun: 50
        };

        const realms = ["凡人", "練氣期一層", "練氣期二層", "練氣期三層", "練氣期中期", "練氣期後期", "練氣期圓滿", "築基期", "金丹期", "元嬰期", "化神期"];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateStatus() {
            let statusText = `
<b>【年齡】</b> ${p.age} 歲 | <b>【境界】</b> ${realms[p.realmIndex]}（進度：${p.progress}%） | <b>【壽元】</b> ${p.age} / ${p.maxLifespan} 年 | <b>【靈石】</b> ${p.lingShi} 塊
<b>【出身背景】</b> ${p.bgType}
<b>【資質體質】</b> 靈根：${p.lingGen} | 體質：${p.bodyType}
<b>【修煉功法】</b> ${p.gongFa}（層數：${p.gongFaLevel}）
<b>【基礎屬性】</b> 顏值：${p.yan} ｜ 智力：${p.zhi} ｜ 心智：${p.xin} ｜ 氣運：${p.yun}
            `;
            document.getElementById('status-panel').innerHTML = statusText;
        }

        function startRandomGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            let randBg = getRandomInt(1, 100);
            if (randBg <= 20) {
                p.bgType = "【三流散修世家】";
                p.bgDetail = "族內僅有練氣期修士，資源匱乏。";
                p.lingGen = ["四靈根", "五靈根"][getRandomInt(0,1)];
            } else if (randBg <= 70) {
                p.bgType = "【二流宗門門閥】";
                p.bgDetail = "宗內有築基與金丹長老坐鎮。";
                p.lingGen = ["三靈根", "雙靈根"][getRandomInt(0,1)];
                p.lingShi = 100;
            } else if (randBg <= 95) {
                p.bgType = "【一流古老聖地】";
                p.bgDetail = "化神大能護道，資源豐厚。";
                p.lingGen = ["單靈根", "變異靈根"][getRandomInt(0,1)];
                p.lingShi = 1000;
                p.maxLifespan = 120;
            } else {
                p.bgType = "【荒古帝族】";
                p.bgDetail = "大帝血脈，諸天萬界無人敢惹！";
                p.lingGen = "極品天靈根";
                p.bodyType = "荒古聖體";
                p.lingShi = 10000;
                p.maxLifespan = 200;
            }

            p.yan = getRandomInt(50, 100);
            p.zhi = getRandomInt(50, 100);
            p.xin = getRandomInt(50, 100);
            p.yun = getRandomInt(50, 100);

            updateStatus();

            document.getElementById('event-panel').innerHTML = `
🌌 <b>【降生事件】</b>
你降生於 ${p.bgType}！${p.bgDetail}<br>
家族為你檢測出 <b>【${p.lingGen}】</b>，體質為 <b>【${p.bodyType}】</b>。<br>
在家族保護下，你平安度過了幼年期（0-12歲）……
            `;

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】參加族內開光儀式，選擇功法正式踏入修仙界</button>
            `;
        }

        function startCheatGame() {
            p.bgType = "【至高不朽帝族】";
            p.lingGen = "萬劫混沌聖靈根";
            p.bodyType = "鴻蒙道體";
            p.lingShi = 99999;
            p.maxLifespan = 500;
            p.yan = 150; p.zhi = 150; p.xin = 150; p.yun = 150;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateStatus();

            document.getElementById('event-panel').innerHTML = `
✨ <b>【神體降世】</b><br>
天地異象九萬里，帝族老祖親自出關為你護道！你獲得了無上傳承。
            `;

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】直接傳承帝經，開啟無敵修煉</button>
            `;
        }

        function startCultivate() {
            p.age = 12;
            p.gongFa = p.bgType.includes("帝族") ? "《太上帝經》" : "《基礎呼吸吐納法》";
            p.realmIndex = 1;
            p.progress = 10;
            updateStatus();

            document.getElementById('event-panel').innerHTML = `
📜 <b>【12歲 · 踏入仙途】</b><br>
你正式開始修練 <b>${p.gongFa}</b>！天地靈氣灌入體內，順利突破至 <b>【練氣期一層】</b>！
            `;

            showMainActions();
        }

        function showMainActions() {
            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="doAction('xiulian')">🧘‍♂️ 閉關苦修（+修為）</button>
                <button class="btn" onclick="doAction('xunbao')">🌲 外出歷練（+靈石/機緣）</button>
                <button class="btn" onclick="doAction('tupo')">⚡ 嘗試突破境界</button>
            `;
        }

        function doAction(type) {
            p.age += 1;
            let log = `<b>【${p.age}歲】</b> `;

            if (type === 'xiulian') {
                let add = getRandomInt(15, 30);
                if (p.lingGen.includes("天靈根") || p.lingGen.includes("聖")) add += 20;
                p.progress += add;
                log += `你閉關苦修一年，修為進度提升了 ${add}%！`;
            } else if (type === 'xunbao') {
                let gain = getRandomInt(20, 100);
                p.lingShi += gain;
                log += `你前往山脈歷練，採集到靈草，獲得了 ${gain} 塊靈石！`;
            } else if (type === 'tupo') {
                if (p.progress >= 100) {
                    p.realmIndex += 1;
                    p.progress = 0;
                    p.maxLifespan += 30;
                    log += `🎉 天劫降臨！你成功渡劫，突破至 <b>【${realms[p.realmIndex]}】</b>！壽元增加 30 年！`;
                } else {
                    log += `❌ 修為尚不足（需要 100%），強行突破導致氣血翻湧，請繼續積累修為！`;
                }
            }

            if (p.age >= p.maxLifespan) {
                document.getElementById('event-panel').innerHTML = `☠️ <b>【壽元耗盡】</b><br>你活到了 ${p.age} 歲，可惜未能證道成仙，最終坐化於洞府之中……`;
                document.getElementById('options-panel').innerHTML = `<button class="btn" onclick="location.reload()">🔄 重新投胎輪迴</button>`;
                return;
            }

            updateStatus();
            document.getElementById('event-panel').innerHTML = log;
            showMainActions();
        }
    </script>
</body>
</html>
