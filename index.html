<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙：大道長生錄 - 唯一真界天道版</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #58a6ff; margin-top: 0; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            display: block;
            width: 100%;
            text-align: left;
            transition: 0.2s;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-special { background-color: #1f6feb; }
        .btn-special:hover { background-color: #388bfd; }
        .btn-cheat { background-color: #8957e5; }
        .btn-danger { background-color: #da3633; }
        
        .chapter-box {
            background: #090d13;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .chapter-title {
            color: #f2e05a;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .chapter-content {
            font-size: 15px;
            white-space: pre-line;
            color: #c9d1d9;
        }
        .status-panel {
            background: #161b22;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #58a6ff;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .tag { color: #f2e05a; font-weight: bold; }
        .highlight { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌌 《修仙：大道長生錄》</h1>
    <p>唯一真界 · 群雄並起 · 天道二十重法網終極演化版</p>

    <div id="start-screen" class="panel">
        <h3>天道二十重法網與戰力鎖已全部鋪設完畢！請選擇開局：</h3>
        <button class="btn btn-special" onclick="initGame('ok')">🎲 【ok】開啟最嚴謹、最硬核的天道隨機投胎</button>
        <button class="btn btn-cheat" onclick="initGame('cheat')">👑 【作弊】帝族嫡系帝子 + 極品天靈根 + 荒古聖體開局</button>
    </div>

    <div id="game-screen" class="panel" style="display:none;">
        <h3>📥 角色數據面板</h3>
        <div id="status-panel" class="status-panel"></div>
        <hr style="border-color: #30363d; margin: 20px 0;">
        <h2>📜 大道演化歷程（滾動履歷）</h2>
        <div id="chapter-container"></div>
        <div id="options-panel" class="panel" style="background:#0d1117;"></div>
    </div>

    <script>
        let p = {
            name: "葉長生", age: 0, realmIdx: 0, progress: 0, lifespan: 85, lingShi: 0,
            bgType: "", bgDetail: "", father: "", mother: "",
            lingGen: "", bodyType: "凡軀",
            yan: 0, zhi: 0, xin: 0, yun: 0,
            rankTianjiao: "未上榜", rankShili: "未上榜", rankJuese: "未上榜",
            gongFa: "無", fuZhi: "尚未解鎖",
            items: [], chapterNum: 1
        };

        const realms = [
            "凡人", "練氣期一層", "練氣期二層", "練氣期三層", "練氣期四層", "練氣期五層",
            "練氣期六層", "練氣期七層", "練氣期八層", "練氣期九層", "練氣期大圓滿",
            "築基初期", "築基中期", "築基後期", "築基大圓滿", "結丹期", "元嬰期", "化神期"
        ];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function scrollToBottom() {
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function updateStatusPanel() {
            document.getElementById('status-panel').innerHTML = `
<b>【年齡】</b> ${p.age} 歲 | <b>【境界】</b> <span class="highlight">${realms[p.realmIdx]}</span> (${p.progress}%) | <b>【肉身強度】</b> ${p.bodyType !== "凡軀" ? p.bodyType : "孱弱"} | <b>【壽元】</b> ${p.age} / ${p.lifespan} 年 | <b>【靈石】</b> ${p.lingShi} 塊<br>
<b>【所在地/狀態】</b> ${p.bgType}（健康）<br>
<b>【血脈因果】</b> 父族：${p.father} ｜ 母族：${p.mother}<br>
<b>【資質體質】</b> 靈根：<span class="tag">${p.lingGen}</span> ｜ 體質：<span class="tag">${p.bodyType}</span><br>
<b>【天道榜單】</b> 天驕榜：<span class="highlight">${p.rankTianjiao}</span> ｜ 實力榜：${p.rankShili} ｜ 絕色榜：${p.rankJuese}<br>
<b>【基礎屬性】</b> 顏值：${p.yan} ｜ 智力：${p.zhi} ｜ 心智：${p.xin} ｜ 氣運：${p.yun}<br>
<b>【功法/副職】</b> ${p.gongFa}（熟練度：0%） ｜ 副職業：${p.fuZhi}<br>
<b>【儲物袋物資】</b> ${p.items.length > 0 ? p.items.join("、") : "無"}
            `;
        }

        function appendChapter(title, text) {
            let container = document.getElementById('chapter-container');
            let div = document.createElement('div');
            div.className = 'chapter-box';
            div.innerHTML = `
                <div class="chapter-title">第 ${p.chapterNum} 章：${title}</div>
                <div class="chapter-content">${text}</div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function initGame(mode) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            if (mode === 'cheat') {
                p.bgType = "【東荒】荒古不朽帝族 · 葉氏帝族祖地";
                p.father = "葉氏帝族第三脈脈主（大聖境後期，掌管帝族三千戰將）";
                p.mother = "隱世荒古世家姬氏嫡女（大聖境初期，身懷純陽帝血）";
                p.lingGen = "極品天靈根"; p.bodyType = "荒古聖體";
                p.lifespan = 185; p.lingShi = 2000;
                p.yan = 128; p.zhi = 135; p.xin = 132; p.yun = 142;
                p.rankTianjiao = "第 7 名（天道注視中）";
                p.items = ["護身帝符x1", "極品培元丹x10", "天元靈石x2000"];
            } else {
                let r = getRandomInt(1, 100);
                if (r <= 5) {
                    p.bgType = "【弱三流背景】農戶/獵戶之家";
                    p.father = "凡人獵戶（無修為）"; p.mother = "採藥婦（無修為）";
                    p.lingGen = ["偽靈根", "五靈根"][getRandomInt(0, 1)];
                    p.lifespan = 75; p.lingShi = 0;
                } else if (r <= 50) {
                    p.bgType = "【二流修仙世家】";
                    p.father = "家族執事（築基初期）"; p.mother = "商會之女（練氣七層）";
                    p.lingGen = ["四靈根", "三靈根"][getRandomInt(0, 1)];
                    p.lifespan = 90; p.lingShi = 100;
                } else if (r <= 95) {
                    p.bgType = "【一流古老聖地】";
                    p.father = "峰主親傳（元嬰後期）"; p.mother = "長老之女（元嬰初期）";
                    p.lingGen = ["雙靈根", "單靈根"][getRandomInt(0, 1)];
                    p.lifespan = 120; p.lingShi = 800;
                } else {
                    p.bgType = "【至高不朽道統】荒古帝族";
                    p.father = "帝族帝子（大聖境）"; p.mother = "荒古神女（大聖境）";
                    p.lingGen = "極品天靈根"; p.bodyType = "荒古聖體";
                    p.lifespan = 185; p.lingShi = 2000;
                    p.rankTianjiao = "第 7 名";
                }
                p.yan = getRandomInt(50, 130); p.zhi = getRandomInt(50, 135);
                p.xin = getRandomInt(50, 135); p.yun = getRandomInt(50, 140);
            }

            updateStatusPanel();

            let introText = `🌌 【降生異象】
你降生於唯一真界【東荒】的 ${p.bgType}！
降生之日，天地靈氣異動，天道法網正式錨定你的宿命。
父族：${p.father}
母族：${p.mother}

在家族/勢力的庇護下，你平安度過了 0-12 歲幼年期……
今日，是你年滿十二歲，正式開啟開脈引氣、進入祖祠挑選【本命功法】與【修仙百藝】的大日子！`;

            appendChapter("0-12歲 · 幼年降生與天道錨定", introText);
            presentChoices12();
        }

        function presentChoices12() {
            p.age = 12;
            let optionsHtml = `<h3>👉 【12 歲 · 核心命運抉擇】請做出你的抉擇：</h3>`;

            optionsHtml += `<button class="btn" onclick="makeChoice(1)">【選項 1】: 【帝道殺伐】 繼承至高帝經《太上鎮天經》，追求同階無敵戰力。</button>`;
            optionsHtml += `<button class="btn" onclick="makeChoice(2)">【選項 2】: 【聖體本源】 專攻肉身與聖體覺醒的《荒古聖體訣》，將肉身推至極致。</button>`;
            optionsHtml += `<button class="btn" onclick="makeChoice(3)">【選項 3】: 【百家之長】 同時參悟兩大帝級殘篇，嘗試自創專屬法門（風險極高）。</button>`;
            optionsHtml += `<button class="btn" onclick="makeChoice(4)">【選項 4】: 【百藝同修】 開啟副職業選擇，專注於煉丹或符陣，儲備底牌。</button>`;
            optionsHtml += `<button class="btn" onclick="makeChoice(5)">【選項 5】: 【隱忍斂翼】 主動申請封印異象與名次，化名下山暗中觀察大勢。</button>`;

            if (p.zhi >= 130) {
                optionsHtml += `<button class="btn btn-special" onclick="makeChoice(6)">【選項 6（智力特權·智謀布局）】: 【借勢分權】 挑起派系平衡，將族內 30% 修練資源劃歸自己掌控。</button>`;
            }
            if (p.xin >= 130) {
                optionsHtml += `<button class="btn btn-special" onclick="makeChoice(7)">【選項 7（心智特權·驅虎吞狼）】: 【帝路清除】 利用冷酷手段，在選功法時引導競爭對手挑選相衝功法，廢其半成道基。</button>`;
            }

            document.getElementById('options-panel').innerHTML = optionsHtml;
            scrollToBottom();
        }

        function makeChoice(num) {
            p.chapterNum += 1;
            p.realmIdx = 1; // 踏入練氣期一層
            p.progress = 20;

            let choiceTexts = {
                1: "你選擇了《太上鎮天經》！磅礴的帝道殺伐氣息灌入體內，你順利引氣入體，踏入【練氣期一層】！",
                2: "你選擇了《荒古聖體訣》！氣血如陽般燃燒，肉身被大幅淬煉，順利踏入【練氣期一層】！",
                3: "你冒險融合兩大帝經殘篇！過程中險些走火入魔，但憑藉極高天資強行壓下，成功踏入【練氣期一層】並悟出奇異氣流！",
                4: "你選擇百藝同修！解鎖了【煉丹師】副職，獲得基礎丹方與靈草，同時踏入【練氣期一層】！",
                5: "你請求封印了天驕榜異象，化名下山。在暗中觀察東荒大勢的同時，順利踏入【練氣期一層】！",
                6: "你運用神算智謀，成功掌控了族內 30% 的資源分配！獲得額外 1000 塊靈石，並踏入【練氣期一層】！",
                7: "你施展冷酷心智，暗中引導堂兄選錯功法使其道基受損！少了一個強勁對手，同時順利踏入【練氣期一層】！"
            };

            p.gongFa = num === 1 ? "《太上鎮天經》" : (num === 2 ? "《荒古聖體訣》" : "《自創帝經殘篇》");
            if (num === 4) p.fuZhi = "一品煉丹師";

            appendChapter(`12歲 · 抉擇與開脈`, choiceTexts[num]);
            updateStatusPanel();

            // 生成後續 13 歲以後的回合
            generateNextTurn();
        }

        function generateNextTurn() {
            p.age += 1;
            p.progress += getRandomInt(25, 45);

            // 自動突破檢測
            if (p.progress >= 100 && p.realmIdx < realms.length - 1) {
                p.realmIdx += 1;
                p.progress -= 100;
                p.lifespan += 10;
                appendChapter(`${p.age}歲 · 水到渠成突破`, `⚡ 【破境天象】體內真氣累積至臨界點，經脈轟然巨響！你順利突破至 **【${realms[p.realmIdx]}】**！壽元增加 10 年！`);
            }

            if (p.age >= p.lifespan) {
                appendChapter(`${p.age}歲 · 大道終章`, `☠️ 【仙途終結】歲月如刀，你活到了 ${p.age} 歲，停留在【${realms[p.realmIdx]}】。耗盡了最後一絲壽元，最終坐化於洞府之中……`);
                document.getElementById('options-panel').innerHTML = `<button class="btn btn-danger" onclick="location.reload()">🔄 重開全新修仙人生</button>`;
                updateStatusPanel();
                scrollToBottom();
                return;
            }

            updateStatusPanel();

            document.getElementById('options-panel').innerHTML = `
                <h3>👉 【${p.age} 歲 · 天道演化回合】</h3>
                <button class="btn" onclick="generateNextTurn()">🧘‍♂️ 繼續推演第 ${p.age} 歲年歲事件與修仙歷程</button>
            `;
            scrollToBottom();
        }
    </script>
</body>
</html>
