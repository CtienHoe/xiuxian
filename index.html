<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙：大道長生錄 - 小說沉浸版</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.7;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #58a6ff; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-cheat { background-color: #8957e5; }
        .btn-danger { background-color: #da3633; }
        .event-log {
            max-height: 400px;
            overflow-y: auto;
            background: #090d13;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        .log-item {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #21262d;
        }
        .tag { color: #f2e05a; font-weight: bold; }
        .highlight { color: #58a6ff; }
    </style>
</head>
<body>

    <h1>📖 《修仙：大道長生錄》V3.0</h1>
    <p>修仙小說沉浸版 · 歷史履歷 · 萬字劇本庫</p>

    <div id="start-screen" class="panel">
        <h3>天道法網重新編織！請選擇你的開局：</h3>
        <button class="btn" onclick="startRandomGame()">🎲 【天道輪迴】隨機出身投胎</button>
        <button class="btn btn-cheat" onclick="startCheatGame()">👑 【帝族降世】無敵天驕小說主角</button>
    </div>

    <div id="game-screen" class="panel" style="display:none;">
        <h2>📥 主角面板與因果</h2>
        <div id="status-panel"></div>
        <hr style="border-color: #30363d; margin: 20px 0;">
        <h2>📜 修仙小說歷程（滾動履歷）</h2>
        <div id="event-log" class="event-log"></div>
        <div id="options-panel" style="margin-top: 20px;"></div>
    </div>

    <script>
        let p = {
            age: 0, realmIdx: 0, progress: 0, lifespan: 80, lingShi: 0,
            bgName: "", father: "", mother: "", lingGen: "", bodyType: "凡軀",
            rateMult: 1, yun: 50, xin: 50, zhi: 50
        };

        const realms = [
            "凡人", "練氣期一層", "練氣期二層", "練氣期三層", "練氣期四層", "練氣期五層",
            "練氣期六層", "練氣期七層", "練氣期八層", "練氣期九層", "練氣期十層大圓滿",
            "築基初期", "築基中期", "築基後期", "築基圓滿", "金丹大能"
        ];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function appendLog(text) {
            let logDiv = document.getElementById('event-log');
            logDiv.innerHTML = `<div class="log-item">${text}</div>` + logDiv.innerHTML;
        }

        function updateStatus() {
            document.getElementById('status-panel').innerHTML = `
<b>【姓名】</b> 葉長生（主角） | <b>【年齡】</b> ${p.age} 歲 | <b>【境界】</b> <span class="highlight">${realms[p.realmIdx]}</span> (${p.progress}%)
<b>【壽元】</b> ${p.age} / ${p.lifespan} 年 | <b>【靈石】</b> ${p.lingShi} 塊 | <b>【修練天資】</b> <span class="tag">${p.rateMult} 倍速</span>
<b>【背景】</b> ${p.bgName} | <b>【資質】</b> ${p.lingGen} (${p.bodyType})
<b>【血脈因果】</b> 父：${p.father} ｜ 母：${p.mother}
            `;
        }

        function startRandomGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            let rand = getRandomInt(1, 100);
            if (rand <= 40) {
                p.bgName = "邊陲小鎮農家"; p.father = "老實獵戶（凡人）"; p.mother = "採藥婦（凡人）";
                p.lingGen = "雜亂五靈根"; p.rateMult = 1; p.lifespan = 75; p.lingShi = 0;
            } else if (rand <= 80) {
                p.bgName = "修仙家族支脈"; p.father = "家族執事（練氣五層）"; p.mother = "丹房弟子（練氣三層）";
                p.lingGen = "地品三靈根"; p.rateMult = 3; p.lifespan = 90; p.lingShi = 100;
            } else if (rand <= 95) {
                p.bgName = "名門正派宗門"; p.father = "內門長老（築基圓滿）"; p.mother = "宗門聖女後裔（築基期）";
                p.lingGen = "天品雙靈根"; p.rateMult = 8; p.lifespan = 120; p.lingShi = 600;
            } else {
                p.bgName = "荒古不朽帝族"; p.father = "帝族神將（大聖境）"; p.mother = "隱世神女（聖境）";
                p.lingGen = "極品天靈根"; p.bodyType = "荒古聖體"; p.rateMult = 25; p.lifespan = 200; p.lingShi = 3000;
            }

            updateStatus();
            appendLog(`🌌 <b>【降生異象】</b> 你降生於【${p.bgName}】！降生之日天地靈氣微微震盪。你的父親是 <span class="highlight">${p.father}</span>，母親是 <span class="highlight">${p.mother}</span>。經家族老祖親自為你測驗，確定你擁有<b>【${p.lingGen}】</b>，體質為<b>【${p.bodyType}】</b>。你平安度過了 0-12 歲的幼年時光。`);

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】踏入家族祠堂，開脈引氣入體</button>
            `;
        }

        function startCheatGame() {
            p.bgName = "至高荒古帝族"; p.father = "當世大帝（無敵姿）"; p.mother = "鴻蒙宮宮主（半仙）";
            p.lingGen = "萬劫混沌聖靈根"; p.bodyType = "鴻蒙道體"; p.rateMult = 60; p.lifespan = 350; p.lingShi = 10000;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateStatus();

            appendLog(`✨ <b>【主角降世】</b> 帝星顆顆隕落，紫氣東來九萬里！你降生於【${p.bgName}】，乃大帝親傳血脈！擁有古今罕見的<b>【${p.lingGen}】</b>與<b>【${p.bodyType}】</b>！修練速度高達 <b>60 倍</b>！`);

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】直接傳承無上帝經，開啟修仙路</button>
            `;
        }

        function startCultivate() {
            p.age = 12; p.realmIdx = 1; p.progress = 0;
            updateStatus();
            appendLog(`📜 <b>【12歲 · 正式仙途】</b> 你坐於靜室之中，運轉引氣決，天地靈氣如狂潮般湧入經脈，一舉衝破關卡，正式踏入 <b>【${realms[p.realmIdx]}】</b>！`);
            showActions();
        }

        function showActions() {
            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="doAction('xiulian')">🧘‍♂️ 洞府閉關 (讀取苦修劇情)</button>
                <button class="btn" onclick="doAction('lilian')">🌲 下山歷練 (觸發小說隨機事件)</button>
                <button class="btn" onclick="doAction('tupo')">⚡ 衝擊小境界 (嘗試渡劫突破)</button>
            `;
        }

        function doAction(type) {
            p.age += 1;
            let ageStr = `<span class="tag">【${p.age}歲】</span> `;

            if (type === 'xiulian') {
                let add = getRandomInt(8, 15) * p.rateMult;
                p.progress += add;

                let xiulianPlots = [
                    `${ageStr}你盤膝坐於靈脈之上，靜心運轉功法。隨著一口濁氣吐出，周身靈氣翻湧，修為進度大幅增長 <b>+${add}%</b>！`,
                    `${ageStr}閉關期間，你對天地大道偶有所悟，隱約觸碰到了一絲玄之又玄的境界，修為順利提升 <b>+${add}%</b>！`,
                    `${ageStr}你苦修一年，不斷壓縮體內的真氣，經脈被拓展得更加寬廣，修為穩健提升 <b>+${add}%</b>！`,
                    `${ageStr}你在族內藏經閣借閱前人筆記，參悟透了一門吐納法門，修練事半功倍，修為暴增 <b>+${add}%</b>！`
                ];
                appendLog(xiulianPlots[getRandomInt(0, xiulianPlots.length - 1)]);

            } else if (type === 'lilian') {
                let rand = getRandomInt(1, 100);

                if (rand <= 30) {
                    let loss = getRandomInt(20, 80);
                    p.lingShi = Math.max(0, p.lingShi - loss);
                    appendLog(`${ageStr}你前往黑市坊市淘寶，不幸遇到了經驗豐富的奸商，被忽悠買下一塊廢鐵，損耗了 <b>${loss} 塊靈石</b>！`);
                } else if (rand <= 70) {
                    let gain = getRandomInt(50, 200);
                    p.lingShi += gain;
                    appendLog(`${ageStr}你深入萬獸山脈外圍，成功擊殺一隻二階妖獸，採集到珍貴的妖丹與材料，入賬 <b>${gain} 塊靈石</b>！`);
                } else if (rand <= 90) {
                    p.progress += 40;
                    appendLog(`${ageStr}你在山谷採藥時，意外撞見兩位高手同歸於盡！你小心翼翼前去拾荒，撿到儲物袋與高階丹藥，修為暴漲 <b>+40%</b>！`);
                } else {
                    p.progress += 80; p.lingShi += 500;
                    appendLog(`${ageStr}💥 <b>【小說主角大機緣！】</b> 你被強敵追殺逼入絕路跌落崖底，竟意外掉入古仙人洞府！獲得無上洗髓丹與靈石堆！修為狂飆 <b>+80%</b>，靈石 <b>+500</b>！`);
                }

            } else if (type === 'tupo') {
                if (p.progress >= 100) {
                    p.realmIdx += 1; p.progress = 0; p.lifespan += 8;
                    appendLog(`${ageStr}🎉 <b>【突破成功！】</b> 你引導全身真氣衝擊瓶頸，體內傳出啪嗒一聲巨響！成功突破登臨 <b>【${realms[p.realmIdx]}】</b>！壽元增加 8 年！`);
                } else {
                    p.progress = Math.max(0, p.progress - 20);
                    appendLog(`${ageStr}❌ <b>【突破失敗！】</b> 你的修為尚未達到大圓滿（目前 ${p.progress}%），強行衝關導致真氣逆流，遭到經脈反噬，修為跌落 20%！`);
                }
            }

            if (p.age >= p.lifespan) {
                appendLog(`☠️ <b>【仙途終結 · 坐化】</b> 歲月無情，你活到了 ${p.age} 歲，停留在【${realms[p.realmIdx]}】。耗盡了最後一絲壽元，最終坐化於洞府之中，化為天下一縷塵埃……`);
                document.getElementById('options-panel').innerHTML = `<button class="btn btn-danger" onclick="location.reload()">🔄 重新投胎輪迴</button>`;
                updateStatus();
                return;
            }

            updateStatus();
            showActions();
        }
    </script>
</body>
</html>
