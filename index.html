<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙：大道長生錄</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #58a6ff; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-cheat { background-color: #8957e5; }
        .btn-danger { background-color: #da3633; }
        .event-text {
            font-size: 15px;
            white-space: pre-line;
            background: #0d1117;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
        }
    </style>
</head>
<body>

    <h1>🌌 《修仙：大道長生錄》V2.0</h1>
    <p>資質碾壓 · 演化事件 · 境界細化版</p>

    <div id="start-screen" class="panel">
        <h3>天道重構完畢！請選擇開局：</h3>
        <button class="btn" onclick="startRandomGame()">【天道】隨機投胎輪迴</button>
        <button class="btn btn-cheat" onclick="startCheatGame()">【作弊】荒古帝族神體開局</button>
    </div>

    <div id="game-screen" class="panel" style="display:none;">
        <h2>📥 角色資質與狀態</h2>
        <div id="status-panel"></div>
        <hr style="border-color: #30363d; margin: 20px 0;">
        <h2>📜 大道演化歷程</h2>
        <div id="event-panel" class="event-text"></div>
        <div id="options-panel" style="margin-top: 20px;"></div>
    </div>

    <script>
        let p = {
            age: 0,
            realmIdx: 0,
            progress: 0,
            lifespan: 80,
            lingShi: 0,
            bgType: "",
            lingGen: "",
            bodyType: "凡軀",
            gongFa: "無",
            rateMult: 1, // 資質倍率
            yan: 50, zhi: 50, xin: 50, yun: 50
        };

        const realms = [
            "凡人", 
            "練氣期一層", "練氣期二層", "練氣期三層", "練氣期四層", "練氣期五層", 
            "練氣期六層", "練氣期七層", "練氣期八層", "練氣期九層", "練氣期十層圓滿", 
            "築基初期", "築基中期", "築基後期", "築基圓滿",
            "金丹初期", "金丹中期", "金丹後期", "金丹圓滿", "元嬰老祖"
        ];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateStatus() {
            document.getElementById('status-panel').innerHTML = `
<b>【年齡】</b> ${p.age} 歲 | <b>【境界】</b> <span style="color:#58a6ff">${realms[p.realmIdx]}</span> (${p.progress}%) | <b>【壽元】</b> ${p.age} / ${p.lifespan} 年
<b>【修煉倍率】</b> <span style="color:#f2e05a">${p.rateMult}x</span> (由靈根體質決定) | <b>【靈石】</b> ${p.lingShi}
<b>【出身資質】</b> ${p.bgType} | 靈根：${p.lingGen} | 體質：${p.bodyType}
<b>【屬性面板】</b> 氣運：${p.yun} ｜ 心智：${p.xin} ｜ 智力：${p.zhi}
            `;
        }

        function startRandomGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            let rand = getRandomInt(1, 100);
            if (rand <= 30) {
                p.bgType = "三流貧瘠山村";
                p.lingGen = "雜亂五靈根";
                p.rateMult = 1; // 廢柴倍率
                p.lifespan = 75;
            } else if (rand <= 75) {
                p.bgType = "修仙家族附屬";
                p.lingGen = "三靈根";
                p.rateMult = 3; // 普通倍率
                p.lifespan = 85;
                p.lingShi = 50;
            } else if (rand <= 95) {
                p.bgType = "一流洞天福地";
                p.lingGen = "地品雙靈根";
                p.rateMult = 8; // 天才倍率
                p.lifespan = 110;
                p.lingShi = 500;
            } else {
                p.bgType = "荒古隱世帝族";
                p.lingGen = "極品天靈根";
                p.bodyType = "荒古聖體";
                p.rateMult = 20; // 絕世奇才倍率
                p.lifespan = 180;
                p.lingShi = 2000;
            }

            p.yun = getRandomInt(40, 100);
            p.xin = getRandomInt(40, 100);
            p.zhi = getRandomInt(40, 100);

            updateStatus();
            document.getElementById('event-panel').innerHTML = `
🌌 <b>【天道輪迴 · 降生】</b><br>
你出生於【${p.bgType}】，族內測出你擁有<b>【${p.lingGen}】</b>，體質為<b>【${p.bodyType}】</b>！<br>
受資質影響，你的修練速度倍率為 <b>${p.rateMult} 倍</b>！天資決定了仙途的下限……<br>
平安度過 0-12 歲幼年期，準備踏入修煉。
            `;

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】領取族內功法，正式開脈修練</button>
            `;
        }

        function startCheatGame() {
            p.bgType = "至高不朽帝族";
            p.lingGen = "萬劫混沌聖靈根";
            p.bodyType = "鴻蒙道體";
            p.rateMult = 50; // 無敵倍率
            p.lifespan = 300;
            p.lingShi = 10000;
            p.yun = 150; p.xin = 150; p.zhi = 150;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateStatus();

            document.getElementById('event-panel').innerHTML = `
✨ <b>【帝星降世】</b><br>
異象覆蓋三千州！你擁有<b>【${p.lingGen}】</b>與<b>【${p.bodyType}】</b>，修練倍率高達 <b>50倍</b>！
            `;

            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="startCultivate()">【12歲】直接傳承無上帝經</button>
            `;
        }

        function startCultivate() {
            p.age = 12;
            p.realmIdx = 1; // 練氣一層
            p.progress = 0;
            updateStatus();

            document.getElementById('event-panel').innerHTML = `
📜 <b>【12歲 · 踏入仙途】</b><br>
你正式引氣入體，突破至 <b>【${realms[p.realmIdx]}】</b>！
            `;

            showActions();
        }

        function showActions() {
            document.getElementById('options-panel').innerHTML = `
                <button class="btn" onclick="doAction('xiulian')">🧘‍♂️ 閉關吐納 (+修為)</button>
                <button class="btn" onclick="doAction('lilian')">🌲 秘境歷練 (隨機事件/機緣)</button>
                <button class="btn" onclick="doAction('tupo')">⚡ 嘗試突破小境界</button>
            `;
        }

        function doAction(type) {
            p.age += 1;
            let log = `<b>【${p.age}歲】</b> `;

            if (type === 'xiulian') {
                let baseAdd = getRandomInt(5, 10);
                let totalAdd = baseAdd * p.rateMult; // 資質倍率計算
                p.progress += totalAdd;

                // 隨機閉關事件演化
                let eventRand = getRandomInt(1, 100);
                if (eventRand <= 15) {
                    p.progress = Math.max(0, p.progress - 20);
                    log += `閉關時心魔作祟，急於求成導致<b>【走火入魔】</b>！修為倒退 20%，損耗些許壽元。`;
                } else if (eventRand >= 85) {
                    p.progress += 30;
                    log += `苦修時福至靈銜，突然進入<b>【頓悟狀態】</b>！額外暴增 30% 修為！`;
                } else {
                    log += `你汲取天地靈氣閉關一年。受資質影響，修為進度增加 <b>+${totalAdd}%</b>！`;
                }

            } else if (type === 'lilian') {
                let eventRand = getRandomInt(1, 100) + (p.yun / 10);

                if (eventRand < 40) {
                    let loss = getRandomInt(10, 30);
                    p.lingShi = Math.max(0, p.lingShi - loss);
                    log += `外出歷練時遭遇邪修劫道！你拼死逃脫，不慎遺失了 <b>${loss} 塊靈石</b>。`;
                } else if (eventRand < 80) {
                    let gain = getRandomInt(30, 150);
                    p.lingShi += gain;
                    log += `在山谷深處採集到百年朱果並售出，獲得了 <b>${gain} 塊靈石</b>！`;
                } else {
                    p.progress += 50;
                    p.lingShi += 200;
                    log += `💥 <b>【大機緣！】</b> 你掉入前人洞府，獲得古仙遺澤！修為大增 50%，並獲得 200 靈石！`;
                }

            } else if (type === 'tupo') {
                if (p.progress >= 100) {
                    p.realmIdx += 1;
                    p.progress = 0;
                    p.lifespan += (p.realmIdx > 10) ? 50 : 5; // 築基以上加大幅壽元
                    log += `🎉 氣血充盈，小境界突破成功！登臨 <b>【${realms[p.realmIdx]}】</b>！壽元增加！`;
                } else {
                    let backfire = getRandomInt(10, 30);
                    p.progress = Math.max(0, p.progress - backfire);
                    log += `❌ 修為不足（目前 ${p.progress}% / 需要 100%），強行衝關失敗！受到經脈反噬，修為損失 ${backfire}%！`;
                }
            }

            // 死亡檢測
            if (p.age >= p.lifespan) {
                document.getElementById('event-panel').innerHTML = `☠️ <b>【壽元耗盡 · 坐化】</b><br>你活了 ${p.age} 歲，停留在【${realms[p.realmIdx]}】，未能打破天地桎梏，最終化為一具枯骨……`;
                document.getElementById('options-panel').innerHTML = `<button class="btn btn-danger" onclick="location.reload()">🔄 重新投胎輪迴</button>`;
                updateStatus();
                return;
            }

            updateStatus();
            document.getElementById('event-panel').innerHTML = log;
            showActions();
        }
    </script>
</body>
</html>
