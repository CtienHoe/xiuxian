<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙：大道長生錄 - 互動小說版</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.8;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { color: #58a6ff; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
            display: block;
            width: 100%;
            text-align: left;
        }
        .btn:hover { background-color: #2ea043; }
        .btn-story { background-color: #1f6feb; }
        .btn-story:hover { background-color: #388bfd; }
        .btn-danger { background-color: #da3633; }
        .chapter-box {
            background: #090d13;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .chapter-title {
            color: #f2e05a;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .chapter-content {
            font-size: 15px;
            white-space: pre-line;
            color: #d2a8ff;
        }
        .status-bar {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: #161b22;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
            font-size: 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>📖 《修仙：大道長生錄》V7.1</h1>
    <p>每回合劇情鋪墊 · 自動滾動 · 分歧抉擇</p>

    <div id="start-screen" class="panel">
        <h3>🌌 選擇你的開局命格：</h3>
        <button class="btn btn-story" onclick="initGame('normal')">🎲 【天道輪迴】隨機出身開啟互動仙途</button>
        <button class="btn btn-story" onclick="initGame('god')">👑 【帝族降世】帝子專屬無敵劇情</button>
    </div>

    <div id="game-screen" class="panel" style="display:none;">
        <div id="status-bar" class="status-bar"></div>
        <div id="chapter-container"></div>
        <div id="options-panel" class="panel" style="background:#0d1117;"></div>
    </div>

    <script>
        let p = {
            name: "葉長生", age: 12, realmIdx: 1, progress: 0, lifespan: 90, lingShi: 100,
            lingGen: "地品天靈根", bodyType: "凡軀", chapterNum: 1, currentScenario: null
        };

        const realms = [
            "凡人", "練氣一層", "練氣二層", "練氣三層", "練氣四層", "練氣五層",
            "練氣六層", "練氣七層", "練氣八層", "練氣九層", "練氣大圓滿",
            "築基初期", "築基中期", "築基後期", "築基大圓滿", "金丹大能"
        ];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function scrollToBottom() {
            setTimeout(() => {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function updateStatusBar() {
            document.getElementById('status-bar').innerHTML = `
<b>【主角】</b> ${p.name} ｜ <b>【年齡】</b> ${p.age} 歲 ｜ <b>【境界】</b> ${realms[p.realmIdx]} (${p.progress}%) ｜ <b>【壽元】</b> ${p.age}/${p.lifespan} 年 ｜ <b>【靈石】</b> ${p.lingShi} 塊
            `;
        }

        function checkBreakthrough() {
            if (p.progress >= 100 && p.realmIdx < realms.length - 1) {
                p.realmIdx += 1;
                p.progress -= 100;
                p.lifespan += 10;
                return `\n\n⚡ 【水到渠成】體內澎湃真氣衝破桎梏！你順利突破至 **【${realms[p.realmIdx]}】**！壽元大增！`;
            }
            return "";
        }

        function initGame(mode) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            if (mode === 'god') {
                p.lingGen = "萬劫混沌天靈根"; p.bodyType = "鴻蒙聖體"; p.lifespan = 200; p.lingShi = 2000;
            }

            updateStatusBar();

            let chapterText = `【第一章：十二歲 · 開脈大典】\n\n你叫${p.name}，年滿十二歲。在家族開脈大典上，測靈石亮起沖天光芒！族長當場宣佈將你列為核心弟子，並賜予功法與獨立靜室。你正式踏入【${realms[p.realmIdx]}】！`;
            
            appendChapter("序章 · 仙途開啟", chapterText);
            presentChoices13();
        }

        function appendChapter(title, text) {
            let container = document.getElementById('chapter-container');
            let div = document.createElement('div');
            div.className = 'chapter-box';
            div.innerHTML = `
                <div class="chapter-title">第 ${p.chapterNum} 章：${title}</div>
                <div class="chapter-content">${text}</div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function presentChoices13() {
            p.age = 13;
            document.getElementById('options-panel').innerHTML = `
                <h3>👉 【十三歲抉擇】後山探索時天降暴雨，你發現了一處隱秘溶洞：</h3>
                <button class="btn" onclick="makeChoice('13_a')">1. 恭敬入內拜祭骸骨，仔細搜索溶洞四周</button>
                <button class="btn" onclick="makeChoice('13_b')">2. 提防有詐，只在洞口避雨，雨停獨立離開</button>
            `;
            scrollToBottom();
        }

        function presentChoices14() {
            p.age = 14;
            document.getElementById('options-panel').innerHTML = `
                <h3>👉 【十四歲抉擇】在仙城坊市中，你看到一個地攤上一塊滿是泥垢的黑鐵片：</h3>
                <button class="btn" onclick="makeChoice('14_a')">1. 花費 30 靈石買下，嘗試用真火燒灼</button>
                <button class="btn" onclick="makeChoice('14_b')">2. 覺得是騙子地攤，轉身前往高階丹藥鋪</button>
            `;
            scrollToBottom();
        }

        // 動態生成帶有劇情介紹的隨機事件
        function generateRandomTurn() {
            p.age += 1;

            if (p.age >= p.lifespan) {
                endGame();
                return;
            }

            const scenarios = [
                {
                    intro: `【${p.age}歲 · 拍賣會爭奪】\n這一年，仙城舉辦了大型拍賣會。壓軸拍品是一株能增加突破概率的「紫雲芝」，現場不少大勢力紛紛競價，氣氛極度緊張。`,
                    opt1: "1. 傾家蕩產參與競拍，誓要拿下仙草",
                    opt2: "2. 放棄競拍，暗中觀察拍下仙草者的動向",
                    res1: { text: "你成功拍下紫雲芝並煉化，修為狂飆，但耗盡了大部分積蓄！", addProg: 60, addStone: -80 },
                    res2: { text: "你尾隨買家發現其遭到捷徑截殺，你順水推舟拾得戰利品！", addProg: 40, addStone: 120 }
                },
                {
                    intro: `【${p.age}歲 · 秘境古陣】\n你在歷練時無意間闖入了一座殘破的上古大陣。陣內光芒閃爍，隱約有仙家靈氣溢出，但周圍佈滿了殺機。`,
                    opt1: "1. 憑藉悟性硬闖古陣，尋求秘境核心機緣",
                    opt2: "2. 繞開殺陣，只在秘境外圍採集靈藥",
                    res1: { text: "你破開殺陣獲得了大能傳承！修為大幅提升！", addProg: 70, addStone: 50 },
                    res2: { text: "你在外圍安全採集到數株珍貴靈草，無驚無險。", addProg: 30, addStone: 60 }
                },
                {
                    intro: `【${p.age}歲 · 魔道潛伏】\n你在路過村莊時，發現有邪修正悄悄佈置血祭大陣，抽取凡人精血修練邪功。對方修為與你在伯仲之間。`,
                    opt1: "1. 拔劍出手，果斷佈置符籙圍殺邪修",
                    opt2: "2. 不明對方底細，悄悄返回傳訊給宗門長老",
                    res1: { text: "你成功斬殺邪修，獲得其儲物袋，名聲大噪！", addProg: 50, addStone: 100 },
                    res2: { text: "宗門長老前來平定邪修，並獎勵了你功德點與丹藥。", addProg: 40, addStone: 40 }
                }
            ];

            p.currentScenario = scenarios[getRandomInt(0, scenarios.length - 1)];

            document.getElementById('options-panel').innerHTML = `
                <h3>👉 【${p.age}歲劇情】${p.currentScenario.intro}</h3>
                <button class="btn" onclick="makeGenericChoice(1)">${p.currentScenario.opt1}</button>
                <button class="btn" onclick="makeGenericChoice(2)">${p.currentScenario.opt2}</button>
            `;
            scrollToBottom();
        }

        function makeGenericChoice(optNum) {
            p.chapterNum += 1;
            let res = (optNum === 1) ? p.currentScenario.res1 : p.currentScenario.res2;
            p.progress += res.addProg;
            p.lingShi += res.addStone;

            let btText = checkBreakthrough();
            appendChapter(`${p.age}歲 · 命運抉擇`, res.text + btText);
            updateStatusBar();

            generateRandomTurn();
        }

        function makeChoice(choiceKey) {
            p.chapterNum += 1;
            let btText = "";

            if (choiceKey === '13_a') {
                p.progress += 50;
                btText = checkBreakthrough();
                appendChapter("13歲 · 獲得古老殘頁", `你恭敬地向溶洞中央的古人骸骨行禮，隨後在骨骸旁發掘出一卷古樸羊皮殘頁！上面記載著一種極為罕見的古老吐納法門，使你的修練速度大大提升！` + btText);
                updateStatusBar();
                presentChoices14();

            } else if (choiceKey === '13_b') {
                p.progress += 20;
                btText = checkBreakthrough();
                appendChapter("13歲 · 平穩避雨", `你謹慎地留在洞口避雨。雨停後你平安返回家族，雖然錯過了機緣，但勝在安全無虞。` + btText);
                updateStatusBar();
                presentChoices14();

            } else if (choiceKey === '14_a') {
                p.lingShi -= 30; p.progress += 60;
                btText = checkBreakthrough();
                appendChapter("14歲 · 撿漏太上劍意", `你買下黑鐵片並用真火燒灼，泥垢剝落後竟顯現出「太上劍意」四個字！你參透了上古劍修心得，攻伐之力大幅增強！` + btText);
                updateStatusBar();
                generateRandomTurn();

            } else if (choiceKey === '14_b') {
                p.lingShi -= 50; p.progress += 30;
                btText = checkBreakthrough();
                appendChapter("14歲 · 購買高階丹藥", `你前往丹藥鋪購買了聚氣丹服下，體內真氣有所積累，修為穩步提升。` + btText);
                updateStatusBar();
                generateRandomTurn();
            }
        }

        function endGame() {
            let container = document.getElementById('chapter-container');
            let div = document.createElement('div');
            div.className = 'chapter-box';
            div.innerHTML = `
                <div class="chapter-title">${p.age}歲 · 大道終章</div>
                <div class="chapter-content">☠️ 【歲月坐化】你活到了 ${p.age} 歲，停留在【${realms[p.realmIdx]}】。耗盡了最後一絲壽元，最終坐化於洞府之中……</div>
            `;
            container.appendChild(div);
            document.getElementById('options-panel').innerHTML = `<button class="btn btn-danger" onclick="location.reload()">🔄 重開全新修仙人生</button>`;
            scrollToBottom();
        }
    </script>
</body>
</html>
